model:
  architecture: resnet18
  num_classes: 10
  class_names:
    - airplane
    - automobile
    - bird
    - cat
    - deer
    - dog
    - frog
    - horse
    - ship
    - truck
training:
  epochs: 2
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3
  num_workers: 2
data:
  dataset: cifar10
  data_dir: /app/data
output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
