apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-training
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: pytorch-training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: pipeline-storage
              mountPath: /app/data
              subPath: data
            - name: pipeline-storage
              mountPath: /app/checkpoints
              subPath: checkpoints
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: pipeline-storage
          persistentVolumeClaim:
            claimName: ml-pipeline-pvc
